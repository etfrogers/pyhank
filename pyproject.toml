[build-system]
requires = ["setuptools>=44", "wheel", "setuptools_scm[toml]>=3.4.3", "build", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length=119

[tool.setuptools_scm]
# This section enables setuptools_scm

[tool.setuptools]
packages = ["pyhank"]

[tool.setuptools.package-data]
"pyhank" = ["matlab/*.m", "matlab/License.txt"]

# [tool.setuptools.packages]
# # Pure Python packages/modules
# find = { where = ["."] }

[[tool.setuptools-rust.ext-modules]]
# Private Rust extension module to be nested into the Python package
target = "pyhank._pyhank_native"  # The last part of the name (e.g. "_lib") has to match lib.name in Cargo.toml,
                             # but you can add a prefix to nest it inside of a Python package.
path = "Cargo.toml"      # Default value, can be omitted
binding = "PyO3"         # Default value, can be omitted


[project]
name = "pyhank"
dynamic = ["version"]
authors = [{ name = "Edward Rogers", email = "etfrogers@hotmail.com" }]
description = "pyhank - Quasi-discrete Hankel transforms for python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy~=2.2",
    "numpy~=2.4; python_version >= '3.14'",
    "scipy~=1.15; python_version == '3.10'",
    "scipy~=1.17; python_version > '3.10'",
]

[project.urls]
Homepage = "https://github.com/etfrogers/pyhank"

[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-cov~=7.0",
    "setuptools_scm",
]
docs = [
    "sphinx-gallery~=0.20",
    "sphinx_rtd_theme~=3.1",
    "pillow~=12.2",
    "matplotlib~=3.10",
]
